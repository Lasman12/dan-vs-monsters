<style>
  :root {
    --bg: #0d0a14; --panel: #1d1728; --panel2: #2a2238; --line: #4a3d60; --text: #f3ecff; --muted: #a99cc0;
    --accent: #ffcc33; --accent2: #e04848; --good: #5ccf4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body.touch.playing { touch-action: none; }
  canvas { -webkit-touch-callout: none; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; --s: 2; }
  #c { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; font-size: calc(6px * var(--s)); }
  body.playing #hud { display: block; }
  .hud-top { position: absolute; top: calc(5px * var(--s)); right: calc(6px * var(--s)); left: calc(6px * var(--s)); display: flex; align-items: center; gap: calc(6px * var(--s)); }
  .hpbar { position: relative; width: calc(90px * var(--s)); height: calc(9px * var(--s)); background: #2a0d18; border: calc(1px * var(--s)) solid #160e1c; box-shadow: 0 0 0 calc(1px * var(--s)) #ffffff40; }
  #hpfill { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; height: 100%; background: linear-gradient(#ff7a7a, #e03040); width: 100%; transition: width .15s; }
  #hpfill.low { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { filter: brightness(1.8); } }
  #hptext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; font-size: calc(4px * var(--s)); color: #fff; text-shadow: 1px 1px 0 #000; direction: ltr; }
  .chip { background: #160e1ccc; border: calc(1px * var(--s)) solid #ffffff30; padding: calc(1.5px * var(--s)) calc(4px * var(--s)); border-radius: calc(2px * var(--s)); font-family: 'Press Start 2P', monospace; font-size: calc(4.5px * var(--s)); display: flex; gap: calc(2px * var(--s)); align-items: center; }
  #lvlname { margin-inline-start: auto; font-family: 'Rubik'; font-weight: 700; font-size: calc(5.5px * var(--s)); text-shadow: 1px 1px 0 #000; opacity: .85; }
  #bossbar { position: absolute; bottom: calc(10px * var(--s)); left: 50%; transform: translateX(-50%); width: calc(260px * var(--s)); display: none; text-align: center; }
  #bossbar.on { display: block; }
  #bossname { font-weight: 900; font-size: calc(7px * var(--s)); text-shadow: 2px 2px 0 #000; color: #ffdddd; margin-bottom: calc(2px * var(--s)); }
  .bosstrack { height: calc(7px * var(--s)); background: #2a0d18; border: calc(1px * var(--s)) solid #160e1c; box-shadow: 0 0 0 calc(1px * var(--s)) #ff505080; position: relative; }
  #bossfill { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; background: linear-gradient(#ff9a3a, #c02020); width: 100%; transition: width .2s; }
  #toast { position: absolute; top: calc(26px * var(--s)); left: 50%; transform: translate(-50%, -10px); background: #160e1cee; border: calc(1px * var(--s)) solid var(--accent); color: #fff; padding: calc(4px * var(--s)) calc(10px * var(--s)); border-radius: calc(3px * var(--s)); font-weight: 700; font-size: calc(6.5px * var(--s)); opacity: 0; transition: .25s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 5; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #deathmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(transparent, #40000080); pointer-events: none; }
  #deathmsg.on { display: flex; }
  #deathmsg b { font-size: calc(18px * var(--s)); font-weight: 900; color: #ff5050; text-shadow: 3px 3px 0 #000; }
  #deathmsg span { font-size: calc(7px * var(--s)); text-shadow: 2px 2px 0 #000; }

  /* overlay screens */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; z-index: 10; }
  .overlay.on { display: flex; background: #0d0a14b0; }
  .overlay.title-bg { background:
      repeating-linear-gradient(0deg, #ffffff06 0 2px, transparent 2px 4px),
      linear-gradient(180deg, #2a1640 0%, #5a2a4a 55%, #e0704a 100%); }
  .panel { background: var(--panel); border: 3px solid #160e1c; box-shadow: 0 0 0 3px var(--line), 0 8px 0 3px #00000060; padding: 18px 22px; border-radius: 4px; max-width: 760px; width: 100%; text-align: center; margin: auto; }
  .panel.narrow { max-width: 420px; }
  .panel.wide { max-width: 900px; }
  .title { font-family: 'Rubik'; font-weight: 900; font-size: clamp(28px, 6vw, 44px); margin: 0; color: var(--accent); text-shadow: 3px 3px 0 var(--accent2), 6px 6px 0 #160e1c; letter-spacing: 1px; }
  h2 { margin: 0 0 10px; font-weight: 900; color: var(--accent); text-shadow: 2px 2px 0 #160e1c; }
  h3 { margin: 6px 0; }
  .sub { color: var(--muted); margin: 6px 0 12px; font-weight: 500; }
  .who { color: var(--muted); margin: 8px 0; }
  .who b { color: var(--text); }
  .hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .hint.small { font-size: 12px; opacity: .8; }
  .col { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { font-family: 'Rubik'; font-weight: 700; font-size: 16px; color: #160e1c; background: var(--accent); border: 3px solid #160e1c; box-shadow: inset 0 -4px 0 #c08a10, 0 3px 0 #160e1c; padding: 8px 16px; border-radius: 3px; cursor: pointer; transition: transform .05s; }
  .btn:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 #c08a10, 0 1px 0 #160e1c; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.big { font-size: 20px; padding: 10px 20px; }
  .btn.ghost { background: var(--panel2); color: var(--text); box-shadow: inset 0 -4px 0 #00000040, 0 3px 0 #160e1c; }
  .btn:focus-visible, .tab:focus-visible, .node:focus-visible, input:focus-visible { outline: 3px solid #7fe3ff; outline-offset: 2px; }
  form { display: flex; flex-direction: column; gap: 10px; text-align: start; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 14px; color: var(--muted); }
  input { font: inherit; font-size: 16px; color: var(--text); background: #120d1a; border: 3px solid #160e1c; box-shadow: 0 0 0 2px var(--line); padding: 8px 10px; border-radius: 3px; -webkit-user-select: text; user-select: text; }
  .hidden { display: none !important; }
  .err { color: #ff7070; min-height: 1.2em; font-weight: 700; font-size: 14px; }
  .tabs { display: flex; margin-bottom: 12px; border: 3px solid #160e1c; border-radius: 3px; overflow: hidden; }
  .tab { flex: 1; font: inherit; font-weight: 700; padding: 8px; background: var(--panel2); color: var(--muted); border: 0; cursor: pointer; }
  .tab.on { background: var(--accent); color: #160e1c; }
  .dan-hero canvas { width: 168px; height: 132px; image-rendering: pixelated; animation: bob 1s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .help { display: grid; gap: 6px; text-align: start; background: #120d1a; padding: 12px; border-radius: 3px; }
  kbd { font-family: 'Press Start 2P', monospace; font-size: 10px; background: var(--panel2); border: 2px solid #160e1c; box-shadow: 0 2px 0 #160e1c; padding: 2px 5px; border-radius: 2px; margin: 0 2px; color: var(--accent); }
  .tips { text-align: start; line-height: 1.6; color: var(--muted); padding-inline-start: 20px; }
  .tips li::marker { color: var(--accent); }
  .map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .node { position: relative; font: inherit; color: #fff; border: 3px solid #160e1c; border-radius: 4px; padding: 10px 6px 8px; cursor: pointer; min-height: 116px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: linear-gradient(180deg, var(--c1) 0 62%, var(--c2) 62% 70%, #3a2a20 70%); box-shadow: 0 4px 0 #160e1c; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
  .node:hover:not(:disabled) { transform: translateY(-2px); }
  .node.locked { filter: grayscale(1) brightness(.45); cursor: not-allowed; }
  .node .num { font-family: 'Press Start 2P'; font-size: 16px; color: var(--accent); }
  .node .nm { font-weight: 900; font-size: 14px; }
  .node .boss { font-size: 11px; opacity: .9; }
  .node .medal { position: absolute; top: -10px; left: -8px; }
  .shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: start; }
  .item { display: flex; align-items: center; gap: 10px; background: #120d1a; border: 3px solid #160e1c; box-shadow: 0 0 0 2px var(--line); padding: 8px 10px; border-radius: 3px; }
  .item.maxed { opacity: .6; }
  .item .ic { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel2); border-radius: 3px; border-bottom: 4px solid var(--ic, var(--line)); flex: none; }
  .item .info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .item small { color: var(--muted); font-size: 12px; }
  .item .buy { font-size: 14px; padding: 6px 10px; white-space: nowrap; }
  .item .tag { color: var(--good); font-weight: 900; font-size: 22px; }
  .medals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 8px 0; }
  .mcell { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #120d1a; padding: 8px 4px; border-radius: 3px; }
  .mcell span { font-size: 12px; font-weight: 700; }
  .mcell small { font-size: 11px; color: var(--muted); }
  .mcell.locked span { color: var(--muted); }
  .medal { image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #160e1c); }
  .medal-big .medal { animation: spinIn .8s cubic-bezier(.2,1.6,.4,1); }
  @keyframes spinIn { from { transform: scale(0) rotate(-200deg); } to { transform: scale(1) rotate(0); } }

  .applink { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 700; text-decoration: none; border: 2px dashed var(--accent); padding: 6px 12px; border-radius: 3px; }
  .settings { display: flex; flex-direction: column; gap: 10px; text-align: start; margin-bottom: 14px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; background: #120d1a; padding: 8px 12px; border-radius: 3px; font-weight: 700; }
  .btn.toggle { min-width: 80px; background: var(--good); box-shadow: inset 0 -4px 0 #2e8a2a, 0 3px 0 #160e1c; }
  .btn.toggle.off { background: #6a6478; box-shadow: inset 0 -4px 0 #4a4458, 0 3px 0 #160e1c; color: #fff; }
  .set-block { display: flex; flex-direction: column; gap: 8px; background: #120d1a; padding: 10px 12px; border-radius: 3px; }
  .set-block small { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .btn.dl { text-decoration: none; text-align: center; display: block; }
  .linkrow { display: flex; gap: 6px; } .linkrow input { flex: 1; min-width: 0; font-size: 13px; }
  /* upgrade hub */
  .upg-grid { display: grid; grid-template-columns: 240px 1fr; gap: 14px; text-align: start; }
  .hero-card { background: #120d1a; border: 3px solid #160e1c; box-shadow: 0 0 0 2px var(--line); border-radius: 3px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: sticky; top: 0; align-self: start; }
  .hero-card.pop .hero-stage { animation: pop .35s; }
  @keyframes pop { 40% { transform: scale(1.12); } }
  .hero-stage { width: 100%; display: grid; place-items: center; padding: 6px 0 0; background: radial-gradient(circle at 50% 70%, #3a2a50, transparent 70%); border-bottom: 4px solid #5bc23c; }
  .hero-stage canvas { width: 168px; height: 132px; image-rendering: pixelated; }
  .coins-big { font-size: 22px; font-weight: 900; color: var(--accent); }
  .stats { width: 100%; display: grid; gap: 4px; }
  .stats div { display: flex; justify-content: space-between; background: var(--panel2); padding: 4px 8px; border-radius: 2px; font-size: 14px; }
  .stats b { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--accent); align-self: center; }
  .gear { color: var(--muted); text-align: center; }
  .tracks { display: flex; flex-direction: column; gap: 8px; }
  .tracks h4 { margin: 6px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 1px; }
  .up { display: flex; align-items: center; gap: 10px; background: #120d1a; border: 3px solid #160e1c; box-shadow: 0 0 0 2px var(--line); padding: 8px 10px; border-radius: 3px; }
  .up.maxed { opacity: .65; }
  .up .ic { font-size: 24px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel2); border-radius: 3px; border-bottom: 4px solid var(--ic); flex: none; }
  .up .info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .up small { color: var(--muted); font-size: 13px; }
  .up em { color: var(--good); font-style: normal; font-weight: 700; }
  .up .arrow { color: var(--muted); }
  .pips { display: flex; gap: 3px; flex-wrap: wrap; }
  .pips i { width: 12px; height: 6px; background: #2a2238; border: 1px solid #160e1c; }
  .pips i.on { background: var(--accent); box-shadow: inset 0 -2px 0 #c08a10; }
  .up .buy { font-size: 14px; padding: 6px 10px; white-space: nowrap; }
  .up .tag { color: var(--good); font-family: 'Press Start 2P', monospace; font-size: 11px; }
  @media (max-width: 640px) { .upg-grid { grid-template-columns: 1fr; } .hero-card { position: static; } }

  /* mana, extra HUD chips */
  .bars { display: flex; flex-direction: column; gap: calc(1.5px * var(--s)); }
  #manabar { position: relative; width: calc(70px * var(--s)); height: calc(4px * var(--s)); background: #10183a; border: calc(1px * var(--s)) solid #160e1c; }
  #manafill { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; width: 0; background: linear-gradient(#7fb8ff, #3a6aff); }
  #manabar.ready #manafill { background: linear-gradient(#e0b0ff, #a050ff); animation: blink .6s steps(2) infinite; }
  #specHud { position: absolute; inset-inline-end: calc(-9px * var(--s)); top: 50%; transform: translateY(-50%); font-size: calc(6px * var(--s)); }

  /* home hub (Brawl Stars style) */
  .overlay.home-bg { background: #0d0a14; padding: 0; align-items: stretch; }
  .home { position: relative; width: 100%; min-height: 100%; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 70%, #ffffff30, transparent 50%), linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%); }
  .home-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .logo { font-weight: 900; font-size: clamp(18px, 3.4vw, 30px); color: var(--accent); text-shadow: 2px 2px 0 var(--accent2), 4px 4px 0 #160e1c; }
  .pills { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { background: #160e1cd0; border: 2px solid #ffffff30; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 #0006; }
  .pill b { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--accent); }
  .iconbtn { font-size: 22px; width: 44px; height: 44px; border-radius: 12px; border: 3px solid #160e1c; background: var(--panel2); box-shadow: 0 3px 0 #160e1c; cursor: pointer; }
  .home-mid { flex: 1; display: grid; grid-template-columns: minmax(150px, 220px) 1fr minmax(170px, 250px); gap: 14px; align-items: center; padding-top: 10px; }
  .home-left, .home-right { display: flex; flex-direction: column; gap: 9px; }
  .home-right { justify-content: flex-end; align-self: stretch; }
  .cat { position: relative; display: flex; align-items: center; gap: 10px; text-align: start; font: inherit; font-weight: 900; font-size: 16px; color: #fff; background: linear-gradient(#3a2f52, #2a2238); border: 3px solid #160e1c; border-radius: 10px; padding: 8px 12px; box-shadow: 0 4px 0 #160e1c, inset 0 2px 0 #ffffff20; cursor: pointer; text-shadow: 1px 1px 0 #000; }
  .cat:hover:not(.locked) { transform: translateY(-2px); filter: brightness(1.12); }
  .cat .ci { font-size: 24px; width: 32px; text-align: center; }
  .cat small { position: absolute; inset-inline-end: 8px; top: -9px; font-size: 10px; background: #160e1c; padding: 1px 6px; border-radius: 6px; color: var(--muted); }
  .cat.locked { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
  .home-center { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; align-self: stretch; padding-bottom: 6px; }
  .stage canvas { width: min(36vh, 300px); height: calc(min(36vh, 300px) * .75); image-rendering: pixelated; }
  .hero-name { font-family: 'Press Start 2P', monospace; font-size: 18px; color: #fff; text-shadow: 3px 3px 0 #160e1c; margin-top: 4px; }
  .hero-gear { font-size: 13px; font-weight: 700; color: #fff; background: #160e1ca0; padding: 3px 10px; border-radius: 8px; margin-top: 6px; text-align: center; }
  .play-btn { font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 10px 12px; border-radius: 14px; border: 4px solid #160e1c;
    background: linear-gradient(#ffe066, #ffb820); box-shadow: 0 6px 0 #160e1c, inset 0 -6px 0 #d08a00, inset 0 3px 0 #fff6; color: #160e1c; }
  .play-btn span { font-family: 'Press Start 2P', monospace; font-size: clamp(20px, 3vw, 28px); }
  .play-btn small { font-weight: 700; font-size: 12px; line-height: 1.3; text-align: center; }
  .play-btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #160e1c, inset 0 -3px 0 #d08a00; }
  .play-btn:focus-visible, .cat:focus-visible, .info-btn:focus-visible, .iconbtn:focus-visible { outline: 3px solid #7fe3ff; outline-offset: 2px; }

  /* upgrade cards with a big "i" */
  .up { position: relative; }
  .up .acts { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .info-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #160e1c; background: #3a8aff; color: #fff; font: 900 18px 'Rubik'; font-style: italic; cursor: pointer; box-shadow: 0 3px 0 #160e1c, inset 0 2px 0 #ffffff50; }
  .info-btn:hover { filter: brightness(1.15); transform: scale(1.06); }
  .up.is-locked { opacity: .7; }
  .up .locktxt { color: #ff9a9a; }
  .tag.lock { font-size: 18px; }
  .btn.small { font-size: 12px; padding: 4px 8px; }
  .btn.on { background: var(--good); box-shadow: inset 0 -3px 0 #2e8a2a, 0 3px 0 #160e1c; color: #160e1c; }
  .btn.danger { color: #ff8a8a; }
  .btn.danger.armed { background: #c03040; color: #fff; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .wlabel { margin: 10px 0 4px; color: var(--muted); text-align: start; }
  .world-tabs { max-width: 420px; margin: 0 auto 12px; }
  .tab.locked { opacity: .55; }
  .node .chests { font-size: 11px; }
  .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; }
  .result-grid div { display: flex; justify-content: space-between; background: #120d1a; padding: 6px 10px; border-radius: 4px; }
  .result-grid b { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--accent); align-self: center; }
  .unlock { background: linear-gradient(90deg, #6a3aff, #ff3a8a); padding: 8px 12px; border-radius: 6px; font-weight: 900; }

  /* "i" modal */
  .modal { position: fixed; inset: 0; z-index: 30; background: #05030aa8; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .modal-box { background: var(--panel); border: 3px solid #160e1c; box-shadow: 0 0 0 3px #3a8aff, 0 10px 0 #0008; border-radius: 6px; padding: 14px 16px; max-width: 760px; width: 100%; text-align: center; animation: popIn .18s ease-out; }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } }
  .modal-box h3 { margin: 0 0 10px; color: var(--accent); font-weight: 900; font-size: 20px; }
  .pv-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .pv-row figure { margin: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center; min-width: 0; }
  .pv-row figcaption { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--muted); }
  .pv-row figure:last-of-type figcaption { color: var(--good); }
  .pv-row figure.maxed figcaption { color: var(--accent); }
  .pv-row canvas { width: 100%; max-width: 320px; aspect-ratio: 16 / 9; image-rendering: pixelated; border: 3px solid #160e1c; border-radius: 4px; background: #000; }
  .pv-row small { color: var(--text); font-weight: 700; font-size: 13px; min-height: 2.4em; }
  .pv-arrow { font-size: 26px; color: var(--accent); flex: none; }

  @media (max-width: 560px) {
    .home-mid { grid-template-columns: 1fr 1fr; }
    .home-center { grid-column: 1 / -1; order: -1; }
  }
  @media (max-height: 520px) {
    .home-mid { gap: 10px; padding-top: 4px; grid-template-columns: minmax(130px, 190px) 1fr minmax(140px, 200px); }
    .logo { font-size: 18px; }
    .cat { padding: 5px 10px; font-size: 14px; } .cat .ci { font-size: 19px; }
    .stage canvas { width: 34vh; height: 25.5vh; }
    .hero-name { font-size: 13px; } .pill { padding: 3px 9px; font-size: 13px; } .iconbtn { width: 36px; height: 36px; font-size: 18px; }
    .play-btn { padding: 8px; } .play-btn span { font-size: 18px; }
    .pv-row canvas { max-width: 240px; }
  }

  .row.tight { margin-top: 0; gap: 8px; } .row.tight .btn { flex: 1; }
  .update-banner { display: block; margin-top: 8px; text-align: center; text-decoration: none; color: #fff; font-weight: 700; background: linear-gradient(90deg, #2a8a3a, #3a8aff); border: 3px solid #160e1c; border-radius: 10px; padding: 6px 10px; box-shadow: 0 3px 0 #160e1c; }
  .update-banner b { color: var(--accent); margin-inline-start: 6px; }
  /* touch: special & weapon swap */
  .tspec { width: 13vmin; height: 13vmin; right: calc(max(4vmin, env(safe-area-inset-right)) + 17vmin); bottom: 45vmin; font-size: 18px; }
  .tswap { width: 10vmin; height: 10vmin; left: calc(max(3vmin, env(safe-area-inset-left)) + 24vmin); top: 3vmin; font-size: 16px; }
  body:not(.has-special) .tspec, body:not(.has-swap) .tswap { display: none; }
  /* in left-to-right languages the HUD sits top-left, so the small top buttons move to the top-right */
  html[dir="ltr"] .tpause { left: auto; right: max(3vmin, env(safe-area-inset-right)); }
  html[dir="ltr"] .tfs { left: auto; right: calc(max(3vmin, env(safe-area-inset-right)) + 12vmin); }
  html[dir="ltr"] .tswap { left: auto; right: calc(max(3vmin, env(safe-area-inset-right)) + 24vmin); }
  html[dir="ltr"] body.touch .hud-top { left: calc(6px * var(--s)); right: calc(40px * var(--s)); }

  /* touch controls */
  #touch { position: fixed; inset: 0; display: none; z-index: 20; direction: ltr; pointer-events: none; }
  #touch.on { display: block; }
  body:not(.playing) #touch, body.paused #touch { display: none; }
  .tbtn { position: fixed; pointer-events: auto; border-radius: 50%; background: #0000002e; border: 3px solid #ffffff59; color: #ffffffd0; font: 900 22px 'Rubik'; display: grid; place-items: center; touch-action: none; -webkit-user-select: none; user-select: none; text-shadow: 0 2px 0 #0008; }
  .tbtn.down { background: #ffcc3355; border-color: #ffcc33; transform: scale(.94); }
  /* sizes are relative to the short side so they fit every phone */
  #jzone { position: fixed; left: 0; bottom: 0; width: 46vw; height: 72vh; pointer-events: auto; touch-action: none; }
  #jbase { position: absolute; left: max(5vmin, env(safe-area-inset-left)); bottom: 5vmin; width: 32vmin; height: 32vmin; border-radius: 50%;
    background: radial-gradient(circle, #ffffff10 0 40%, #0000002e 41%); border: 3px solid #ffffff59; opacity: .75; transition: opacity .15s; }
  #jbase.active { opacity: 1; bottom: auto; transition: none; }
  #jbase::before, #jbase::after { content: '◀'; position: absolute; top: 50%; left: 7%; transform: translateY(-50%); color: #ffffff80; font-size: 4vmin; }
  #jbase::after { content: '▶'; left: auto; right: 7%; }
  #jknob { position: absolute; left: 50%; top: 50%; width: 14vmin; height: 14vmin; margin: -7vmin 0 0 -7vmin; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffffb0, #ffffff55); border: 3px solid #ffffffcc; box-shadow: 0 3px 0 #0005; }
  #bzone { position: fixed; right: 0; bottom: 0; width: 50vw; height: 78vh; pointer-events: auto; touch-action: none; }
  .tj { width: 25vmin; height: 25vmin; right: max(4vmin, env(safe-area-inset-right)); bottom: 4vmin; font-size: 34px; }
  .ta { width: 21vmin; height: 21vmin; right: calc(max(4vmin, env(safe-area-inset-right)) + 28vmin); bottom: 3vmin; font-size: 30px; }
  .tdash { width: 16vmin; height: 16vmin; right: calc(max(4vmin, env(safe-area-inset-right)) + 4.5vmin); bottom: 32vmin; font-size: 17px; }
  .tpot { width: 14vmin; height: 14vmin; right: calc(max(4vmin, env(safe-area-inset-right)) + 31vmin); bottom: 28vmin; font-size: 18px; }
  .tpause { width: 10vmin; height: 10vmin; left: max(3vmin, env(safe-area-inset-left)); top: 3vmin; font-size: 15px; }
  .tfs { width: 10vmin; height: 10vmin; left: calc(max(3vmin, env(safe-area-inset-left)) + 12vmin); top: 3vmin; font-size: 18px; }
  body.fs .tfs { display: none; }
  body.touch #lvlname { display: none; }
  html[dir="rtl"] body.touch .hud-top { left: calc(40px * var(--s)); }
  #rotate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; font-weight: 700; font-size: 20px; }
  #rotate .ph { width: 60px; height: 100px; border: 5px solid var(--accent); border-radius: 10px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch.playing #rotate { display: flex; } }

  @media (max-width: 640px) {
    .map, .medals { grid-template-columns: repeat(2, 1fr); }

  }
  /* short landscape phones: compact menus */
  @media (max-height: 520px) {

    .col .btn.big { flex-basis: 100%; }
    .btn { font-size: 14px; padding: 6px 12px; } .btn.big { font-size: 17px; padding: 8px 14px; }

    .medals { grid-template-columns: repeat(5, 1fr); }
    .hero-stage canvas { width: 112px; height: 88px; }
    form { gap: 6px; } input { padding: 6px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
